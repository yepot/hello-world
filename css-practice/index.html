<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="백엔드 개발과 AI에 관심이 있는 학생 양은서의 개인 프로필입니다.">
  <title>양은서 | 개인 프로필</title>
  <!-- 모든 스타일은 같은 폴더의 외부 CSS 파일에서 불러옵니다. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <p class="eyebrow">MY LITTLE SPACE</p>
    <h1>양은서의 프로필</h1>
    <nav aria-label="페이지 내부 메뉴">
      <a href="#profile">소개</a>
      <a href="#skills">Skills</a>
      <a href="#contact">연락처</a>
    </nav>
  </header>

  <main class="profile-card">
    <!-- 사진 파일 없이 텍스트 이니셜로 프로필을 표현합니다. -->
    <section id="profile" class="profile" aria-labelledby="profile-title">
      <div class="initials" role="img" aria-label="양은서의 이니셜 ES">ES</div>
      <p class="eyebrow">HELLO, I'M EUNSEO</p>
      <h2 id="profile-title">양은서</h2>
      <p class="bio">백엔드 개발과 AI에 관심이 있는 학생입니다.</p>
      <p class="interest">Backend Development &amp; AI</p>
    </section>

    <section id="skills" class="detail-section" aria-labelledby="skills-title">
      <p class="eyebrow">WHAT I LEARN</p>
      <h2 id="skills-title">Skills</h2>
      <!-- 목록 항목을 연보라색 배지 모양으로 꾸밉니다. -->
      <ul class="skill-list">
        <li>HTML</li>
        <li>CSS</li>
        <li>Java</li>
        <li>Spring Boot</li>
      </ul>
    </section>

    <section id="contact" class="detail-section" aria-labelledby="contact-title">
      <p class="eyebrow">GET IN TOUCH</p>
      <h2 id="contact-title">연락처</h2>
      <p class="contact-note">전화: 010-0000-0000</p>
      <a class="email-link" href="mailto:yes03326@gmail.com">yes03326@gmail.com <span aria-hidden="true">↗</span></a>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 양은서. HTML &amp; CSS로 만든 작은 소개 공간.</p>
  </footer>
</body>
</html>
